name: نشر نسخة الويب

# ينشر نسخةً قابلةً للّعب على GitHub Pages، تُفتح من متصفّح الهاتف مباشرةً.
#
# النشرُ يتمّ بدفع الموقع المبنيّ إلى فرع gh-pages، لا عبر بيئة النشر
# «github-pages». والسببُ أنّ تلك البيئة تُنشأ بقاعدة حمايةٍ تقصر النشرَ على
# فرعٍ بعينه، فتَرفض المهمّةَ قبل تنفيذ أيّ خطوةٍ منها. وهذا الطريقُ لا يعتمد
# على تلك القاعدة، فيعمل مهما كانت إعداداتُها.
#
# يتطلّب ضبطَ مصدر Pages مرّةً واحدة: Deploy from a branch ← gh-pages ← / (root)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      # لا يُنشر بناءٌ لم يمرّ بالتحليل والاختبارات.
      - run: flutter analyze
      - run: flutter test

      # الموقعُ يُخدَم من مسارٍ فرعيٍّ باسم المستودع، فيلزم ضبطُ base href.
      - name: بناء الويب
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: دفع الموقع إلى فرع gh-pages
        working-directory: build/web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # يمنع Jekyll من ابتلاع الملفّات التي تبدأ بشرطةٍ سفليّة.
          touch .nojekyll
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "نشر نسخة الويب من ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
