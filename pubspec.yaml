name: rihlat_alarabiyya
description: "رحلة العربية — لعبة مغامرة تعليمية يحدد فيها الإعرابُ الطريق."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/questions/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
    # الخطُّ الاحتياطيُّ للمحرّك، مُرفَقٌ محلّيًّا كيلا يطلبَه التطبيقُ من الشبكة.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
